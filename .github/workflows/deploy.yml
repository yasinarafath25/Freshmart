# Build, check and deploy FreshMart to Cloudflare Workers.
#
# Runs on every push to main (and manually from the Actions tab).
# - Always: install, lint, typecheck, unit tests, Cloudflare (OpenNext) build.
# - Deploy steps run only when the required GitHub secrets exist, so the build is
#   still verified before you finish setting up Cloudflare and the database.
#
# Required secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL, APP_URL
# Optional secrets:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, RESEND_API_KEY, EMAIL_FROM,
#   SSLCOMMERZ_STORE_ID, SSLCOMMERZ_STORE_PASSWORD,
#   SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD (creates the first Super Admin once)
name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
        env:
          # The build never touches the database; placeholders keep config validation happy.
          APP_URL: ${{ secrets.APP_URL || 'https://example.com' }}

      - name: Check deploy secrets
        id: ready
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL APP_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Build passed. Add these GitHub secrets to deploy:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate database
        if: steps.ready.outputs.ok == 'true'
        run: npx drizzle-kit migrate

      - name: Seed (safe to repeat; never overwrites your edits)
        if: steps.ready.outputs.ok == 'true'
        run: npx tsx scripts/seed.ts
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

      - name: Deploy to Cloudflare
        if: steps.ready.outputs.ok == 'true'
        run: npx opennextjs-cloudflare deploy

      - name: Sync runtime secrets to the Worker
        if: steps.ready.outputs.ok == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SSLCOMMERZ_STORE_ID: ${{ secrets.SSLCOMMERZ_STORE_ID }}
          SSLCOMMERZ_STORE_PASSWORD: ${{ secrets.SSLCOMMERZ_STORE_PASSWORD }}
        run: |
          node -e '
            const keys = ["DATABASE_URL","APP_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","RESEND_API_KEY","EMAIL_FROM","SSLCOMMERZ_STORE_ID","SSLCOMMERZ_STORE_PASSWORD"];
            const out = Object.fromEntries(keys.filter(k => process.env[k]).map(k => [k, process.env[k]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Uploading secrets:", Object.keys(out).join(", "));
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Smoke test the live site
        if: steps.ready.outputs.ok == 'true'
        run: |
          sleep 10
          BASE_URL="$APP_URL" node scripts/smoke.mjs
